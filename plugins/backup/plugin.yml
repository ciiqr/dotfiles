name: backup
when: os in ["macos", "linux", "windows"]

provision:
  when: declaration == "backup"

schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: "null"

---
when: os in ["macos", "linux"]
after: packages

executable: backup.sh

dependencies:
  packages:
    - rsync

---
when: os == "windows"

executable: backup.ps1
