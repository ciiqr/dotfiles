name: backup
when: os == "macos" || os == "linux" || os == "windows"

provision:
  when: declaration == "backup"

schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: "null"

---
when: os == "macos" || os == "linux"
after: packages

executable: backup.sh

dependencies:
  packages:
    - rsync

---
when: os == "windows"

executable: backup.ps1
