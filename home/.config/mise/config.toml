[settings]
trusted_config_paths = ["~/Projects", "~/pentible", "~/work"]
status.missing_tools = "always"
gpg_verify = true
node.gpg_verify = true
swift.gpg_verify = true

[tools]
usage = "latest"
"cargo-binstall" = "1.19.1"
node = "latest"
"npm:semver" = "7.7.2"

# just nvim things
neovim = "0.12.4"
tree-sitter = "0.26.8"
# "bash-language-server" = "TODO"
"npm:vscode-langservers-extracted" = "4.10.0"
"lua-language-server" = "3.17.1"
"marksman" = "2026-02-08"
"npm:@prisma/language-server" = "31.6.15"
"npm:@tailwindcss/language-server" = "0.14.29"
"npm:typescript-language-server" = "5.1.3"
"npm:prettier" = "3.8.3"
"npm:json5" = "2.2.3"
"go" = "1.27.0"
stylua = "2.5.2"
shfmt = "3.14.0"
